name: english_quest_a1
description: A neon gamified A1 English learning app built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_tts: ^3.8.5
  http: ^1.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  speech_to_text: ^6.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
