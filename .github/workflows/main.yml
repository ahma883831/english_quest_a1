name: Build Flutter APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Create Flutter scaffold
        run: flutter create --platforms=android temp_app
      - name: Add internet permission
        run: |
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET" \/>/' temp_app/android/app/src/main/AndroidManifest.xml
      - name: Copy project files
        run: |
          cp lib/main.dart temp_app/lib/main.dart
          cp lib/models.dart temp_app/lib/models.dart
          cp lib/lessons_data.dart temp_app/lib/lessons_data.dart
          cp pubspec.yaml temp_app/pubspec.yaml
      - name: Get dependencies
        run: cd temp_app && flutter pub get
      - name: Build APK
        run: cd temp_app && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
