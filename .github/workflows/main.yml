name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Restore or create debug keystore
        run: |
          mkdir -p ~/.android

      - name: Cache debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android temp_app

      - name: Update Kotlin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' \
            temp_app/android/settings.gradle

      - name: Add Android permissions
        run: |
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>/' \
            temp_app/android/app/src/main/AndroidManifest.xml

      - name: Copy project files
        run: |
          # Copy every Dart file from the repository.
          cp -r lib/*.dart temp_app/lib/

          # Copy the dependency configuration.
          cp pubspec.yaml temp_app/pubspec.yaml

          # Make sure declared asset directories exist.
          mkdir -p temp_app/assets/scenes

          echo "===== LIB FILES ====="
          ls -la temp_app/lib

          echo "===== SCENE FILES ====="
          ls -la temp_app/lib/*scene*.dart

          echo "===== ASSETS ====="
          find temp_app/assets -maxdepth 2 -type d -print

      - name: Get dependencies
        run: |
          cd temp_app
          flutter pub get

      - name: Analyze Flutter project
        run: |
          cd temp_app
          flutter analyze lib --no-fatal-infos

      - name: Debug project
        run: |
          cd temp_app

          echo "===== MAIN IMPORTS ====="
          grep -n "^import " lib/main.dart || true

          echo "===== SCENE FILES ====="
          ls -la lib/*scene*.dart

          echo "===== PUBSPEC ====="
          cat pubspec.yaml

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
